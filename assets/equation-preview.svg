<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">Typora Equation Preview</title>
  <desc id="desc">A Typora-style editor showing an equation reference opening the referenced formula in a popover.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f8f5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#26354a" flood-opacity=".16"/>
    </filter>
    <filter id="popover-shadow" x="-25%" y="-35%" width="150%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#182233" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="1280" height="680" rx="30" fill="url(#bg)"/>
  <circle cx="1108" cy="92" r="92" fill="#7367f0" opacity=".08"/>
  <circle cx="135" cy="596" r="115" fill="#2f81f7" opacity=".08"/>

  <text x="640" y="58" text-anchor="middle" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Click a reference. See the equation. Stay in context.</text>

  <g filter="url(#shadow)">
    <rect x="76" y="90" width="1128" height="526" rx="15" fill="#ffffff" stroke="#d8dee9"/>
    <path d="M91 90h1098a15 15 0 0 1 15 15v42H76v-42a15 15 0 0 1 15-15z" fill="#f6f8fa"/>
    <line x1="76" y1="147" x2="1204" y2="147" stroke="#d8dee9"/>
    <circle cx="110" cy="119" r="6" fill="#ff5f57"/>
    <circle cx="131" cy="119" r="6" fill="#febc2e"/>
    <circle cx="152" cy="119" r="6" fill="#28c840"/>
    <text x="640" y="126" text-anchor="middle" fill="#667085" font-family="Segoe UI, Arial, sans-serif" font-size="15">derivation.md — Typora</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="142" y="200" fill="#1f2937" font-size="25" font-weight="650">4. Error dynamics</text>
    <text x="142" y="239" fill="#3f4754" font-size="18">Substituting the previous identities into the closed-loop model gives</text>

    <rect x="248" y="267" width="784" height="78" rx="8" fill="#fbfcfe" stroke="#cfd7e3"/>
    <text x="640" y="317" text-anchor="middle" fill="#202938" font-family="Cambria Math, Cambria, serif" font-size="25" font-style="italic">eₖ₊₁ = (A − B K)eₖ + Bᵣrₖ + dₖ</text>
    <text x="1082" y="316" fill="#3f4754" font-family="Cambria Math, Cambria, serif" font-size="21">(4.2)</text>

    <text x="142" y="397" fill="#3f4754" font-size="18">Insert equations</text>
    <rect x="283" y="372" width="64" height="34" rx="7" fill="#e9f3ff" stroke="#69a7ee"/>
    <text x="315" y="395" text-anchor="middle" fill="#0969da" font-family="Cambria Math, Cambria, serif" font-size="18">(1.6)</text>
    <text x="360" y="397" fill="#3f4754" font-size="18">and</text>
    <text x="397" y="397" fill="#0969da" font-family="Cambria Math, Cambria, serif" font-size="18">(1.7)</text>
    <text x="443" y="397" fill="#3f4754" font-size="18">into</text>
    <text x="482" y="397" fill="#0969da" font-family="Cambria Math, Cambria, serif" font-size="18">(4.1)</text>
    <text x="530" y="397" fill="#3f4754" font-size="18">and</text>
    <text x="568" y="397" fill="#0969da" font-family="Cambria Math, Cambria, serif" font-size="18">(4.2)</text>
    <text x="616" y="397" fill="#3f4754" font-size="18">— without leaving this paragraph.</text>

    <path d="M315 416l-10 14h20z" fill="#ffffff" stroke="#b7c2d0" stroke-width="1.2"/>
    <g filter="url(#popover-shadow)">
      <rect x="207" y="428" width="630" height="116" rx="12" fill="#ffffff" stroke="#b7c2d0"/>
      <rect x="225" y="446" width="6" height="80" rx="3" fill="#2f81f7"/>
      <text x="260" y="478" fill="#667085" font-size="14" font-weight="600">EQUATION (1.6)</text>
      <text x="522" y="513" text-anchor="middle" fill="#202938" font-family="Cambria Math, Cambria, serif" font-size="25" font-style="italic">xₖ₊₁ = A xₖ + B uₖ + E dₖ</text>
    </g>

    <g transform="translate(289 383)">
      <path d="M0 0l1 26 7-7 6 13 7-4-7-13 10-1z" fill="#172033" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <rect x="886" y="465" width="242" height="45" rx="22.5" fill="#172033"/>
    <text x="1007" y="493" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Plain click · no page jump</text>
    <text x="1007" y="539" text-anchor="middle" fill="#667085" font-size="14">Ctrl+click keeps native navigation</text>
  </g>

  <text x="640" y="650" text-anchor="middle" fill="#5a6472" font-family="Segoe UI, Arial, sans-serif" font-size="16">Official \label + \eqref · Native Popover · Zero dependencies</text>
</svg>
